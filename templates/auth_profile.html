<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile - Flood Shelter Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="auth-page-shell">
    <section class="auth-card">
      <div class="auth-header">
        <div class="brand-badge justify-content-center mb-3">
          <div class="brand-icon">👤</div>
          <div>User Account Profile</div>
        </div>
        <span class="eyebrow mb-1">Authenticated Account</span>
        <h1 class="panel-title">{{ user.full_name }}</h1>
      </div>

      <div class="profile-grid">
        <div class="summary-card">
          <span class="summary-label">Email Address</span>
          <strong class="summary-value profile-value">{{ user.email }}</strong>
        </div>
        <div class="summary-card">
          <span class="summary-label">Assigned Role</span>
          <strong class="summary-value profile-value text-capitalize">{{ user.role|replace('_', ' ')|title }}</strong>
        </div>
        <div class="summary-card">
          <span class="summary-label">Status</span>
          <strong class="summary-value profile-value" style="color: var(--safe-green);">{{ "Active" if user.is_active else "Inactive" }}</strong>
        </div>
      </div>

      <div class="action-row justify-content-between mt-4">
        <a class="btn btn-ghost" href="{{ url_for('web.home') }}">← Back to Dashboard</a>
        <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
          <button class="btn btn-signal" type="submit">Sign Out</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
