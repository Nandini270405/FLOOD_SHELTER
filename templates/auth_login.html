<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Flood Shelter Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="auth-page-shell">
    <section class="auth-card">
      <div class="auth-header">
        <div class="brand-badge justify-content-center mb-3">
          <div class="brand-icon">🌊</div>
          <div>Flood Shelter Intelligence</div>
        </div>
        <span class="eyebrow mb-1">Account Access</span>
        <h1 class="panel-title">Operations Portal Login</h1>
        <p class="panel-text">Enter your credentials to access role-based shelter management features.</p>
      </div>

      {% if error %}
      <div class="status-banner is-error mb-4">⚠️ {{ error }}</div>
      {% endif %}

      <form method="post" class="control-form">
        <input type="hidden" name="next" value="{{ next_url }}">
        
        <div class="field-block">
          <label class="form-label" for="email">📧 Email Address</label>
          <input id="email" name="email" type="email" class="form-control" placeholder="name@example.com" required autofocus>
        </div>

        <div class="field-block">
          <label class="form-label" for="password">🔒 Password</label>
          <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="action-row flex-column mt-4">
          <button class="btn btn-signal w-100" type="submit">Log In to Portal</button>
          <div class="d-flex justify-content-between align-items-center w-100 mt-3 fs-6">
            <a class="btn btn-ghost btn-sm" href="{{ url_for('web.home') }}">← Back to Dashboard</a>
            <a class="btn btn-ghost btn-sm" href="{{ url_for('auth.signup') }}">Create Account</a>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
